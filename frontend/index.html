<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fraud Detection Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #8b949e;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 20px;
      padding: 4px 12px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #d29922;
      animation: blink 1s infinite;
    }
    .dot.ok    { background: #3fb950; animation: none; }
    .dot.error { background: #f85149; animation: none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    .header-stats {
      margin-left: auto;
      display: flex;
      gap: 24px;
      font-size: 13px;
      color: #8b949e;
    }
    .header-stats strong { color: #e6edf3; font-weight: 600; }

    /* ── Layout ─────────────────────────────────────────────── */
    #layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ────────────────────────────────────────────── */
    #sidebar {
      width: 280px;
      background: #161b22;
      border-right: 1px solid #30363d;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar-section { padding: 20px; }
    .sidebar-section + .sidebar-section { border-top: 1px solid #30363d; }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: #8b949e;
      margin-bottom: 12px;
    }

    .pattern-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      background: transparent;
      border: 2px solid #30363d;
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      color: #e6edf3;
      text-align: left;
      margin-bottom: 8px;
      transition: border-color .15s, background .15s;
    }
    .pattern-btn:last-child { margin-bottom: 0; }
    .pattern-btn:hover { border-color: #58a6ff; background: #0d1117; }
    .pattern-btn.active {
      border-color: var(--c);
      background: #0d1117;
      box-shadow: 0 0 0 1px var(--c);
    }

    .btn-stripe {
      width: 4px;
      min-height: 36px;
      border-radius: 2px;
      flex-shrink: 0;
      background: var(--c);
      opacity: 0.6;
    }
    .pattern-btn.active .btn-stripe { opacity: 1; }

    .btn-name { font-size: 14px; font-weight: 600; line-height: 1.2; }
    .btn-sub  { font-size: 12px; color: #8b949e; margin-top: 3px; font-weight: 400; }

    /* legend */
    .legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #c9d1d9;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .legend-row:last-child { margin-bottom: 0; }
    .legend-swatch {
      width: 14px; height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* ── Graph area ─────────────────────────────────────────── */
    #graph-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #cy { width: 100%; height: 100%; }

    /* loading overlay */
    #loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0d1117;
      gap: 14px; font-size: 15px; color: #8b949e;
      z-index: 10;
    }
    #loading code {
      color: #58a6ff; font-size: 13px;
      font-family: 'Courier New', monospace;
    }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Explanation card ───────────────────────────────────── */
    #explanation {
      position: absolute;
      top: 16px; right: 16px;
      width: 310px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 18px 20px;
      display: none;
      animation: fadeDown .18s ease;
      z-index: 5;
    }
    @keyframes fadeDown {
      from { opacity:0; transform:translateY(-6px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .exp-tag {
      display: inline-block;
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .09em;
      padding: 3px 10px; border-radius: 5px;
      margin-bottom: 10px;
    }
    .exp-title {
      font-size: 16px; font-weight: 700;
      margin-bottom: 10px; line-height: 1.3;
    }
    .exp-body {
      font-size: 13px; color: #8b949e;
      line-height: 1.7; font-weight: 400;
    }
    .exp-body p + p { margin-top: 10px; }

    /* ── Detail panel ───────────────────────────────────────── */
    #detail {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: #161b22;
      border-top: 1px solid #30363d;
      padding: 14px 22px 16px;
      display: none;
      animation: slideUp .18s ease;
      z-index: 5;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    .detail-head {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 12px;
    }
    .type-badge {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      padding: 3px 10px; border-radius: 5px;
    }
    .detail-name { font-size: 17px; font-weight: 600; }
    .detail-close {
      margin-left: auto; background: none; border: none;
      color: #8b949e; cursor: pointer; font-size: 18px; line-height: 1;
      font-weight: 300;
    }
    .detail-close:hover { color: #e6edf3; }
    .props { display: flex; flex-wrap: wrap; gap: 8px; }
    .prop {
      background: #0d1117; border: 1px solid #30363d;
      border-radius: 7px; padding: 5px 12px; font-size: 13px;
    }
    .pk { color: #8b949e; font-weight: 400; }
    .pv { color: #e6edf3; font-weight: 600; margin-left: 5px; }
    .risk-row {
      display: flex; align-items: center; gap: 10px;
      margin-top: 10px;
    }
    .risk-lbl { font-size: 12px; color: #8b949e; white-space: nowrap; font-weight: 500; }
    .risk-track {
      flex: 1; height: 7px; background: #30363d;
      border-radius: 4px; overflow: hidden;
    }
    .risk-fill { height: 100%; border-radius: 4px; transition: width .3s; }
    .risk-num  { font-size: 14px; font-weight: 700; min-width: 30px; text-align: right; }
  </style>
</head>
<body>

<!-- ── Header ───────────────────────────────────────────────── -->
<header>
  <h1>Fraud Detection Network</h1>
  <div class="status-pill">
    <div id="dot" class="dot"></div>
    <span id="status-txt">Connecting</span>
  </div>
  <div class="header-stats">
    <div>Nodes <strong id="n-count">—</strong></div>
    <div>Relationships <strong id="r-count">—</strong></div>
  </div>
</header>

<!-- ── Body ─────────────────────────────────────────────────── -->
<div id="layout">

  <aside id="sidebar">
    <div class="sidebar-section">
      <div class="section-label">Fraud Scenarios</div>
    </div>
    <div class="sidebar-section">
      <div class="section-label">Node Legend</div>
    </div>
  </aside>

  <div id="graph-area">
    <div id="loading">
      <div class="spinner"></div>
      <div>Connecting to Neo4j</div>
    </div>
    <div id="cy"></div>
    <div id="explanation"></div>
    <div id="detail">
      <div class="detail-head">
        <span id="d-badge" class="type-badge"></span>
        <span id="d-name"  class="detail-name"></span>
        <button class="detail-close" onclick="closeDetail()">x</button>
      </div>
      <div id="d-props" class="props"></div>
    </div>
  </div>

</div>

<script>
// ── Config ────────────────────────────────────────────────────
const NEO4J = 'http://localhost:7474';
const AUTH  = 'Basic ' + btoa('neo4j:password123');

// ── Node colours / shapes ─────────────────────────────────────
// Vivid, memorable colours — one strong hue per type
const NODE_STYLE = {
  Person:      { color: '#FF3B5C', shape: 'ellipse'        },  // bright red
  Account:     { color: '#2563EB', shape: 'roundrectangle' },  // cobalt blue
  Transaction: { color: '#F59E0B', shape: 'diamond'        },  // amber gold
  Device:      { color: '#10B981', shape: 'ellipse'        },  // emerald green
  PhoneNumber: { color: '#8B5CF6', shape: 'ellipse'        },  // vivid purple
  Address:     { color: '#06B6D4', shape: 'ellipse'        },  // cyan
  Merchant:    { color: '#F97316', shape: 'roundrectangle' },  // orange
};

// ── Fraud patterns ────────────────────────────────────────────
const PATTERNS = [
  {
    id: 'full',
    name: 'Full Network',
    sub: 'All nodes and relationships',
    color: '#58a6ff',
    query: 'MATCH (n)-[r]->(m) RETURN n, r, m LIMIT 300',
    tagLabel: 'Overview',
    title: 'The Complete Fraud Network',
    body: [
      'Every entity in the dataset and how they connect. Use this view to orient yourself before drilling into a specific pattern.',
      'Look for three visible clusters: the identity-sharing pair on one side, the circular money loop in the middle, and the mule accounts bridging outward.'
    ]
  },
  {
    id: 'takeover',
    name: 'Account Takeover',
    sub: 'Alice and Bob share identity signals',
    color: '#FF3B5C',
    query: `
      MATCH (p1:Person)-[r1:USES_DEVICE]->(d:Device)<-[r2:USES_DEVICE]-(p2:Person)
      WHERE p1.person_id < p2.person_id
      OPTIONAL MATCH (p1)-[r3:HAS_PHONE]->(ph:PhoneNumber)<-[r4:HAS_PHONE]-(p2)
      OPTIONAL MATCH (p1)-[r5:LIVES_AT]->(ad:Address)<-[r6:LIVES_AT]-(p2)
      OPTIONAL MATCH (p1)-[r7:OWNS]->(a1:Account)
      OPTIONAL MATCH (p2)-[r8:OWNS]->(a2:Account)
      RETURN p1, p2, d, ph, ad, a1, a2, r1, r2, r3, r4, r5, r6, r7, r8
    `,
    tagLabel: 'Pattern 1',
    title: 'Account Takeover — Shared Identity',
    body: [
      'Alice and Bob share the same device, phone number, and home address. Real people occasionally share a home, but sharing a device AND a phone number means one identity is almost certainly synthetic — created to open a second account.',
      'This is how banks catch it: one graph traversal from the device surfaces both accounts instantly. In SQL you need three separate self-joins across different tables. In a graph it is a single MATCH.'
    ]
  },
  {
    id: 'laundering',
    name: 'Money Laundering',
    sub: 'Carol, Dave, and Eve move money in a circle',
    color: '#F59E0B',
    query: `
      MATCH path = (a1:Account)-[s1:SENT]->(t1:Transaction)-[to1:TO]->(a2:Account)
                   -[s2:SENT]->(t2:Transaction)-[to2:TO]->(a3:Account)
                   -[s3:SENT]->(t3:Transaction)-[to3:TO]->(a1)
      WHERE a1.account_id < a2.account_id AND a1.account_id < a3.account_id
      OPTIONAL MATCH (p1:Person)-[o1:OWNS]->(a1)
      OPTIONAL MATCH (p2:Person)-[o2:OWNS]->(a2)
      OPTIONAL MATCH (p3:Person)-[o3:OWNS]->(a3)
      RETURN p1,p2,p3, a1,a2,a3, t1,t2,t3, s1,s2,s3, to1,to2,to3, o1,o2,o3
    `,
    tagLabel: 'Pattern 2',
    title: 'Money Laundering — Circular Transfers',
    body: [
      'Carol, Dave, and Eve move money in a closed loop: A300 to A400 to A500 back to A300. This layering stage of money laundering tries to obscure the origin of funds by making them appear to move legitimately.',
      'Detecting a 3-cycle in SQL requires a self-join three levels deep. In Neo4j the circular pattern is a single Cypher clause and executes in milliseconds — the same query works for cycles of any length.'
    ]
  },
  {
    id: 'mule',
    name: 'Mule Network',
    sub: 'Frank and Grace feed into the ring',
    color: '#8B5CF6',
    query: `
      MATCH (p1:Person)-[r1:HAS_PHONE|LIVES_AT]->(shared)<-[r2:HAS_PHONE|LIVES_AT]-(p2:Person)
      WHERE id(p1) < id(p2)
      OPTIONAL MATCH (p1)-[o1:OWNS]->(a1:Account)
      OPTIONAL MATCH (p2)-[o2:OWNS]->(a2:Account)
      OPTIONAL MATCH (a2)-[s:SENT]->(t:Transaction)-[to:TO]->(a3:Account)<-[o3:OWNS]-(p3:Person)
      RETURN p1,p2,p3, shared, a1,a2,a3, r1,r2, o1,o2,o3, s,t,to
    `,
    tagLabel: 'Pattern 3',
    title: 'Mule Network — Shared Contact Details',
    body: [
      'Frank and Grace share a phone number and address — the same identity-overlap signal as the account takeover case — but their role is different: their accounts receive money and pass it onward into the laundering ring.',
      'Money mules are often recruited innocently. Graph analysis exposes the link between their accounts and the wider ring even when the mules themselves have never met the ring members.'
    ]
  }
];

// ── Neo4j HTTP query ──────────────────────────────────────────
async function query(cypher) {
  const res = await fetch(`${NEO4J}/db/neo4j/tx/commit`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': AUTH },
    body: JSON.stringify({
      statements: [{ statement: cypher.trim(), resultDataContents: ['graph'] }]
    })
  });
  if (!res.ok) throw new Error(`Neo4j HTTP ${res.status}`);
  const json = await res.json();
  if (json.errors?.length) throw new Error(json.errors[0].message);

  const nodes = new Map(), rels = new Map();
  for (const r of json.results)
    for (const d of r.data) {
      for (const n of d.graph?.nodes || []) nodes.set(n.id, n);
      for (const r of d.graph?.relationships || []) rels.set(r.id, r);
    }
  return { nodes: [...nodes.values()], rels: [...rels.values()] };
}

// ── Convert to Cytoscape elements ─────────────────────────────
function toElements({ nodes, rels }) {
  const els = [];
  for (const n of nodes) {
    const lbl = n.labels[0] || 'Unknown';
    const p   = n.properties;
    const display = {
      Person:      p.name,
      Account:     p.account_id,
      Transaction: `$${p.amount}`,
      Device:      p.label || p.device_type,
      PhoneNumber: p.phone_number,
      Address:     p.street,
      Merchant:    p.name,
    }[lbl] ?? n.id;

    els.push({ group: 'nodes', data: {
      id: n.id, label: display, lbl, props: p,
      risk: lbl === 'Person' ? Number(p.risk_score ?? 0) : 0
    }});
  }
  for (const r of rels) {
    els.push({ group: 'edges', data: {
      id: r.id, source: r.startNode, target: r.endNode,
      label: r.type, props: r.properties
    }});
  }
  return els;
}

// ── Cytoscape stylesheet ──────────────────────────────────────
function buildStylesheet() {
  const perLabel = Object.entries(NODE_STYLE).map(([lbl, s]) => ({
    selector: `node[lbl = "${lbl}"]`,
    style: { 'background-color': s.color, shape: s.shape }
  }));

  return [
    {
      selector: 'node',
      style: {
        label: 'data(label)',
        color: '#ffffff',
        'font-family': 'Poppins, sans-serif',
        'font-size': '11px',
        'font-weight': '600',
        'text-valign': 'bottom',
        'text-margin-y': '7px',
        'text-outline-color': '#0d1117',
        'text-outline-width': '3px',
        width: 48, height: 48,
        'border-width': 2,
        'border-color': 'transparent',
        'transition-property': 'opacity border-color border-width width height',
        'transition-duration': '180ms'
      }
    },
    ...perLabel,
    {
      selector: 'node[lbl = "Person"]',
      style: {
        width:  'mapData(risk, 0, 100, 44, 68)',
        height: 'mapData(risk, 0, 100, 44, 68)'
      }
    },
    {
      selector: 'node[lbl = "Transaction"]',
      style: { width: 34, height: 34 }
    },
    {
      selector: 'edge',
      style: {
        label: 'data(label)',
        'font-family': 'Poppins, sans-serif',
        'font-size': '10px',
        'font-weight': '500',
        color: '#6e7681',
        'text-outline-color': '#0d1117',
        'text-outline-width': '2px',
        'text-rotation': 'autorotate',
        'line-color': '#30363d',
        'target-arrow-color': '#30363d',
        'target-arrow-shape': 'triangle',
        'curve-style': 'bezier',
        width: 2,
        'arrow-scale': 0.8,
        'transition-property': 'opacity line-color target-arrow-color width',
        'transition-duration': '180ms'
      }
    },
    {
      selector: '.hl-node',
      style: { 'border-color': '#FFD700', 'border-width': 5, opacity: 1 }
    },
    {
      selector: '.hl-edge',
      style: {
        'line-color': '#FFD700',
        'target-arrow-color': '#FFD700',
        width: 3.5,
        opacity: 1
      }
    },
    {
      selector: '.dim',
      style: { opacity: 0.07 }
    },
    {
      selector: ':selected',
      style: { 'border-color': '#58a6ff', 'border-width': 4 }
    }
  ];
}

// ── Cytoscape instance ────────────────────────────────────────
let cy = null;

function initCy(elements) {
  cy = cytoscape({
    container: document.getElementById('cy'),
    elements,
    style: buildStylesheet(),
    layout: {
      name: 'cose',
      animate: true,
      animationDuration: 900,
      nodeRepulsion: 12000,
      idealEdgeLength: 100,
      gravity: 0.9,
      fit: true,
      padding: 50
    },
    minZoom: 0.2,
    maxZoom: 4,
  });

  cy.on('tap', 'node', e => showDetail(e.target));
  cy.on('tap', e  => { if (e.target === cy) closeDetail(); });
}

// ── Apply pattern (highlight / dim) ──────────────────────────
async function applyPattern(p, blockedTransfer) {
  document.querySelectorAll('.pattern-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`btn-${p.id}`).classList.add('active');
  document.getElementById('explanation').style.display = 'none';

  if (p.id === 'full') {
    cy.batch(() => cy.elements().removeClass('hl-node hl-edge dim'));
    showExplanation(p, blockedTransfer);
    return;
  }

  try {
    const { nodes, rels } = await query(p.query);
    const nids = new Set(nodes.map(n => n.id));
    const rids = new Set(rels.map(r => r.id));

    cy.batch(() => {
      cy.nodes().addClass('dim').removeClass('hl-node');
      cy.edges().addClass('dim').removeClass('hl-edge');
      cy.nodes().filter(n => nids.has(n.id())).removeClass('dim').addClass('hl-node');
      cy.edges().filter(e => rids.has(e.id())).removeClass('dim').addClass('hl-edge');
    });

    showExplanation(p, blockedTransfer);
  } catch (err) {
    console.error('Pattern query failed:', err);
  }
}

function showExplanation(p, blockedTransfer) {
  const box = document.getElementById('explanation');
  const banner = blockedTransfer?.from && blockedTransfer?.to
    ? `<div style="margin-bottom:10px;font-size:12px;color:#f85149;font-weight:700;letter-spacing:.04em">
         BLOCKED TRANSFER: ${blockedTransfer.from} &rarr; ${blockedTransfer.to}
       </div>`
    : '';
  box.innerHTML = `
    ${banner}
    <span class="exp-tag" style="background:${p.color}25;color:${p.color}">${p.tagLabel}</span>
    <div class="exp-title">${p.title}</div>
    <div class="exp-body">${p.body.map(t => `<p>${t}</p>`).join('')}</div>
  `;
  box.style.display = 'block';
}

// ── Intro state (calm default before any pattern is picked) ──
function showIntro() {
  const box = document.getElementById('explanation');
  box.innerHTML = `
    <span class="exp-tag" style="background:#58a6ff25;color:#58a6ff">Start Here</span>
    <div class="exp-title">How to Read This Graph</div>
    <div class="exp-body">
      <p>Each shape/color is one entity type — check the legend in the sidebar (people, accounts, transactions, devices, phones, addresses, merchants).</p>
      <p>Pick a scenario on the left to highlight just that fraud pattern and dim everything else, or zoom and drag to explore the full network freely.</p>
    </div>
  `;
  box.style.display = 'block';
}

// ── Node detail panel ─────────────────────────────────────────
function showDetail(node) {
  const lbl   = node.data('lbl');
  const props = node.data('props') || {};
  const color = NODE_STYLE[lbl]?.color || '#888';

  document.getElementById('d-badge').textContent = lbl;
  document.getElementById('d-badge').style.cssText = `background:${color}25;color:${color}`;
  document.getElementById('d-name').textContent = node.data('label');

  const riskScore = Number(props.risk_score ?? -1);
  const rows = Object.entries(props)
    .filter(([k]) => k !== 'risk_score')
    .map(([k, v]) => `<div class="prop"><span class="pk">${k}</span><span class="pv">${v}</span></div>`)
    .join('');

  let riskHtml = '';
  if (riskScore >= 0) {
    const rc = riskScore >= 80 ? '#FF3B5C' : riskScore >= 60 ? '#F59E0B' : '#10B981';
    riskHtml = `
      <div class="risk-row">
        <span class="risk-lbl">Risk Score</span>
        <div class="risk-track">
          <div class="risk-fill" style="width:${riskScore}%;background:${rc}"></div>
        </div>
        <span class="risk-num" style="color:${rc}">${riskScore}</span>
      </div>`;
  }

  document.getElementById('d-props').innerHTML = rows + riskHtml;
  document.getElementById('detail').style.display = 'block';
}

function closeDetail() {
  document.getElementById('detail').style.display = 'none';
}

// ── Build sidebar ─────────────────────────────────────────────
function buildSidebar() {
  const [scenSection, legendSection] =
    document.querySelectorAll('#sidebar .sidebar-section');

  PATTERNS.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'pattern-btn';
    btn.id        = `btn-${p.id}`;
    btn.style.setProperty('--c', p.color);
    btn.innerHTML = `
      <div class="btn-stripe"></div>
      <div>
        <div class="btn-name">${p.name}</div>
        <div class="btn-sub">${p.sub}</div>
      </div>`;
    btn.onclick = () => applyPattern(p);
    scenSection.appendChild(btn);
  });

  Object.entries(NODE_STYLE).forEach(([lbl, s]) => {
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML = `<div class="legend-swatch" style="background:${s.color}"></div>${lbl}`;
    legendSection.appendChild(row);
  });
}

// ── Boot ──────────────────────────────────────────────────────
async function boot() {
  buildSidebar();
  const dot = document.getElementById('dot');
  const txt = document.getElementById('status-txt');

  try {
    const result = await query('MATCH (n)-[r]->(m) RETURN n, r, m LIMIT 300');
    const els    = toElements(result);

    document.getElementById('loading').style.display = 'none';
    initCy(els);

    document.getElementById('n-count').textContent = result.nodes.length;
    document.getElementById('r-count').textContent = result.rels.length;

    dot.className = 'dot ok';
    txt.textContent = 'neo4j://localhost:7687';

    const params = new URLSearchParams(location.search);
    const linkedPattern = PATTERNS.find(p => p.id === params.get('pattern'));

    if (linkedPattern) {
      applyPattern(linkedPattern, { from: params.get('from'), to: params.get('to') });
    } else {
      showIntro();
    }

  } catch (err) {
    dot.className = 'dot error';
    txt.textContent = 'Connection failed';
    document.getElementById('loading').innerHTML = `
      <div style="font-size:36px;font-weight:700;color:#f85149">!</div>
      <div style="color:#f85149;font-weight:600;font-size:16px">Cannot reach Neo4j</div>
      <div style="text-align:center;line-height:1.8;color:#8b949e">
        Make sure the container is running:<br>
        <code>docker compose up -d</code><br><br>
        Then start the frontend server:<br>
        <code>npm start</code>
      </div>`;
  }
}

boot();
</script>
</body>
</html>
